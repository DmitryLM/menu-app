<style>
  :root {
    --cream: #FFECC0;
    --peach: #FFC29B;
    --pink: #F39F9F;
    --berry: #B95E82;
    --text: #4a2a3a;
    --muted: #7a5a6a;
    --card: #ffffff;
    --shadow: 0 4px 14px rgba(185,94,130,0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--cream); color: var(--text); line-height: 1.5;
  }
  header {
    background: linear-gradient(135deg, var(--berry), var(--pink));
    color: #fff; padding: 18px 20px; box-shadow: var(--shadow);
  }
  header h1 { margin: 0; font-size: 24px; }
  header .sub { opacity: 0.9; font-size: 13px; margin-top: 4px; }
  nav.tabs {
    display: flex; gap: 8px; padding: 12px 16px; flex-wrap: wrap;
    background: var(--peach);
  }
  nav.tabs button {
    border: none; background: var(--card); color: var(--berry);
    padding: 10px 16px; border-radius: 12px; cursor: pointer;
    font-weight: 600; font-size: 15px; box-shadow: var(--shadow);
    transition: transform .15s, background .15s;
  }
  nav.tabs button.active { background: var(--berry); color: #fff; }
  nav.tabs button:hover { transform: translateY(-2px); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--card); border-radius: 16px; padding: 16px;
    box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 12px; color: var(--berry); font-size: 20px; }
  .card h3 { margin: 12px 0 8px; color: var(--berry); font-size: 16px; }
  button.primary {
    background: var(--berry); color: #fff; border: none; padding: 10px 18px;
    border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14px;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost {
    background: transparent; color: var(--berry); border: 2px solid var(--berry);
    padding: 8px 14px; border-radius: 12px; cursor: pointer; font-weight: 600;
  }
  button.danger { background: var(--pink); color: #fff; border: none; padding: 6px 12px; border-radius: 10px; cursor: pointer; }
  input, textarea, select {
    width: 100%; padding: 10px 12px; border: 2px solid var(--peach);
    border-radius: 10px; font-family: inherit; font-size: 14px; background: #fff;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--berry); }
  textarea { min-height: 80px; resize: vertical; }
  label { font-weight: 600; font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  .field { margin-bottom: 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 120px; }
  .ing-row { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 8px; align-items: end; margin-bottom: 8px; }
  .ing-row input, .ing-row select { width: 100%; }
  .recipe-card {
    border: 2px solid var(--peach); border-radius: 14px; padding: 14px;
    margin-bottom: 12px; background: #fffdf7;
  }
  .recipe-card h3 { color: var(--berry); margin: 0 0 6px; }
  .recipe-meta { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .badge { display: inline-block; background: var(--peach); color: var(--berry); padding: 2px 8px; border-radius: 8px; font-size: 12px; font-weight: 600; margin-right: 4px; }
  .thumb { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; margin-top: 8px; }
  .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  @media (max-width: 900px) { .day-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 500px) { .day-grid { grid-template-columns: 1fr; } }
  .day-col {
    background: var(--card); border-radius: 14px; padding: 12px; box-shadow: var(--shadow);
    min-height: 160px;
  }
  .day-col h3 { margin: 0 0 8px; color: var(--berry); font-size: 16px; text-align: center; }
  .day-date { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .planned-item {
    background: var(--peach); border-radius: 10px; padding: 8px; margin-bottom: 6px;
    font-size: 13px;
  }
  .planned-item .title { font-weight: 600; color: var(--berry); }
  .planned-item .actions { display: flex; gap: 4px; margin-top: 4px; align-items: center; }
  .planned-item button { padding: 2px 6px; font-size: 11px; border-radius: 6px; border: none; cursor: pointer; }
  .nutrition { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-top: 8px; }
  .nut { background: var(--peach); border-radius: 8px; padding: 6px; text-align: center; font-size: 12px; }
  .nut b { display: block; color: var(--berry); font-size: 14px; }
  .shop-item { display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid var(--peach); }
  .shop-item.checked span { text-decoration: line-through; opacity: 0.5; }
  .shop-cat { background: var(--berry); color: #fff; padding: 6px 12px; border-radius: 10px; margin: 12px 0 6px; font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--berry); color: #fff; padding: 10px 18px; border-radius: 12px;
    box-shadow: var(--shadow); z-index: 1000; display: none;
  }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none;
    align-items: center; justify-content: center; z-index: 900; padding: 16px;
  }
  .modal { background: #fff; border-radius: 16px; max-width: 700px; width: 100%; max-height: 90vh; overflow: auto; padding: 20px; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid var(--peach); border-top-color: var(--berry); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .link-box { background: var(--peach); padding: 10px; border-radius: 10px; word-break: break-all; font-size: 12px; }
  .config-banner { background: #fff3cd; border: 2px solid #ffc107; padding: 12px; border-radius: 12px; margin-bottom: 12px; }
  .week-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .week-nav .label { font-weight: 700; color: var(--berry); font-size: 16px; text-align: center; flex: 1; }

  @media print {
    nav.tabs, header, .config-banner, button, .week-nav button, input, select, textarea { display: none !important; }
    body { background: #fff; }
    .card { box-shadow: none; border: 1px solid #ccc; }
    .day-grid { grid-template-columns: repeat(7, 1fr); }
    main { max-width: 100%; }
  }
</style>

function normName(s){ return (s||'').toLowerCase().trim().replace(/[.,!?;:]/g,''); }
function findNutrition(name){
  const n = normName(name);
  if(NUTDB[n]) return NUTDB[n];
  let best=null;
  for(const key in NUTDB){
    if(n.includes(key) || key.includes(n)){ best=NUTDB[key]; break; }
  }
  if(best) return best;
  const first = n.split(/\s+/)[0];
  if(NUTDB[first]) return NUTDB[first];
  for(const key in NUTDB){
    if(key.startsWith(first) || first.startsWith(key.split(/\s+/)[0])){ return NUTDB[key]; }
  }
  return null;
}
function unitToGrams(amount, unit, name){
  const a = parseFloat(amount) || 0;
  if(!a) return 0;
  const u = (unit||'г').toLowerCase();
  if(u==='г'||u==='g') return a;
  if(u==='кг'||u==='kg') return a*1000;
  if(u==='мл'||u==='ml') return a;
  if(u==='л'||u==='l') return a*1000;
  if(u==='ст.л.'||u==='ст ложка'||u==='tbsp') return a*15;
  if(u==='ч.л.'||u==='tsp') return a*5;
  if(u==='щепотка') return a*2;
  if(u==='по вкусу') return 0;
  if(u==='шт'){
    const nm = normName(name);
    let w = 100;
    for(const k in PIECE_WEIGHTS){ if(nm.includes(k)){ w = PIECE_WEIGHTS[k]; break; } }
    return a*w;
  }
  return a;
}
async function searchOFF(name){
  try {
    const url = 'https://ru.openfoodfacts.org/cgi/search.pl?search_terms=' + encodeURIComponent(name) + '&search_simple=1&action=process&json=1&page_size=3';
    const res = await fetch(url, { signal: AbortSignal.timeout(6000) });
    const data = await res.json();
    const p = (data.products||[])[0];
    if(!p) return null;
    const n = p.nutriments || {};
    const kcal = n['energy-kcal_100g'] ?? (n['energy_100g']? n['energy_100g']/4.184 : null);
    return {
      k: kcal!=null? +kcal.toFixed(1) : 0,
      p: +(n.proteins_100g||0).toFixed(1),
      f: +(n.fat_100g||0).toFixed(1),
      c: +(n.carbohydrates_100g||0).toFixed(1),
    };
  } catch(e){ return null; }
}
async function calcRecipeNutrition(ingredients){
  let totalG = 0, kcal=0, p=0, f=0, c=0;
  for(const ing of ingredients){
    const g = unitToGrams(ing.amount, ing.unit, ing.name);
    totalG += g;
    let nut = findNutrition(ing.name);
    if(!nut) nut = await searchOFF(ing.name);
    if(nut && g>0){
      const factor = g/100;
      kcal += nut.k*factor; p += nut.p*factor; f += nut.f*factor; c += nut.c*factor;
    }
  }
  return {
    totalGrams: Math.round(totalG),
    kcal: Math.round(kcal),
    protein: +p.toFixed(1),
    fat: +f.toFixed(1),
    carbs: +c.toFixed(1),
  };
}

function getMonday(d){
  const date = new Date(d); const day = date.getDay();
  const diff = (day===0 ? -6 : 1-day);
  date.setDate(date.getDate()+diff); date.setHours(0,0,0,0);
  return date;
}

function compressImage(file, maxDim=700, quality=0.7){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w=img.width, h=img.height;
        if(w>maxDim||h>maxDim){ if(w>h){h=Math.round(h*maxDim/w);w=maxDim;} else {w=Math.round(w*maxDim/h);h=maxDim;} }
        const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function defaultPlan(){ return { mon:[], tue:[], wed:[], thu:[], fri:[], sat:[], sun:[] }; }
function loadLocal(){
  try {
    const raw = localStorage.getItem('menuapp_' + state.householdId);
    if(raw){
      const d = JSON.parse(raw);
      state.recipes = d.recipes||[];
      state.trash = d.trash||[];
      state.weeks = d.weeks||{};
      if(d.plan && !d.weeks){ state.weeks[state.weekKey] = { plan: d.plan, checked: d.checked||{} }; }
    }
  } catch(e){}
  // ensure current week
  if(!state.weeks[state.weekKey]) state.weeks[state.weekKey] = { plan: defaultPlan(), checked: {} };
  state.plan = state.weeks[state.weekKey].plan || defaultPlan();
  state.checked = state.weeks[state.weekKey].checked || {};
}
function saveLocal(){
  state.weeks[state.weekKey] = { plan: state.plan, checked: state.checked };
  localStorage.setItem('menuapp_' + state.householdId, JSON.stringify({ recipes: state.recipes, trash: state.trash, weeks: state.weeks }));
}

async function hashPassword(pw){
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

    await new Promise((resolve, reject)=>{

async function addRecipe(data){
  const nut = await calcRecipeNutrition(data.ingredients);
  if(data.manualNutrition){
    const m = data.manualNutrition;
    if(m.kcal!=null) nut.kcal = m.kcal;
    if(m.protein!=null) nut.protein = m.protein;
    if(m.fat!=null) nut.fat = m.fat;
    if(m.carbs!=null) nut.carbs = m.carbs;
    if(m.totalGrams!=null) nut.totalGrams = m.totalGrams;
  }
  const payload = { ...data, nutrition: nut };
  delete payload.manualNutrition;
  if(state.localMode){
    const r = { id: uid(), ...payload, createdAt: Date.now() };
    state.recipes.unshift(r);
    saveLocal(); render();
    return r.id;
  } else {
    return await fbAddRecipe(payload);
  }
}
async function updateRecipe(id, data){
  const nut = await calcRecipeNutrition(data.ingredients);
  if(data.manualNutrition){
    const m = data.manualNutrition;
    if(m.kcal!=null) nut.kcal = m.kcal;
    if(m.protein!=null) nut.protein = m.protein;
    if(m.fat!=null) nut.fat = m.fat;
    if(m.carbs!=null) nut.carbs = m.carbs;
    if(m.totalGrams!=null) nut.totalGrams = m.totalGrams;
  }
  const payload = { ...data, nutrition: nut };
  delete payload.manualNutrition;
  if(state.localMode){
    const idx = state.recipes.findIndex(r=>r.id===id);
    if(idx>=0){ state.recipes[idx] = { ...state.recipes[idx], ...payload }; saveLocal(); render(); }
  } else {
    await fbUpdateRecipe(id, payload);
  }
}
async function deleteRecipe(id){
  const r = state.recipes.find(x=>x.id===id);
  if(!r) return;
  if(!confirm('Удалить рецепт «' + r.name + '»? Он попадёт в «Удалённые» на 30 дней.')) return;
  const deletedAt = Date.now();
  if(state.localMode){
    state.trash.unshift({ ...r, deletedAt });
    state.recipes = state.recipes.filter(x=>x.id!==id);
    for(const k in state.plan){ state.plan[k] = state.plan[k].filter(x=>x.recipeId!==id); }
    purgeExpiredTrashLocal();
    saveLocal(); render();
  } else {
    await addDoc(trashCol(), { ...r, deletedAt: serverTimestamp(), _deletedAtMs: deletedAt });
    await fbDeleteRecipe(id);
    for(const k in state.plan){ state.plan[k] = state.plan[k].filter(x=>x.recipeId!==id); }
    savePlan();
  }
  toast('🗑️ Перенесено в удалённые');
}

async function restoreRecipe(id){
  const r = state.trash.find(x=>x.id===id);
  if(!r) return;
  const { deletedAt, _deletedAtMs, ...recipe } = r;
  if(state.localMode){
    state.recipes.unshift(recipe);
    state.trash = state.trash.filter(x=>x.id!==id);
    saveLocal(); render();
    toast('↩️ Восстановлено');
    return;
  }
  // optimistic
  state.recipes.unshift(recipe);
  state.trash = state.trash.filter(x=>x.id!==id);
  render();
  try {
    await fbAddRecipe(recipe);
    await deleteDoc(doc(state.db,'households',state.householdId,'trash',id));
    toast('↩️ Восстановлено');
  } catch(e){
    console.error(e);
    state.recipes = state.recipes.filter(x=>x.id!==recipe.id);
    state.trash.unshift(r);
    render();
    toast('❌ Ошибка восстановления');
  }
}

async function hardDeleteTrash(id){
  if(!confirm('Удалить навсегда? Это действие необратимо.')) return;
  const item = state.trash.find(x=>x.id===id);
  console.log('[HARDDELETE] Starting hard delete for:', id, 'localMode=', state.localMode, 'user=', state.user?.uid);
  if(state.localMode){
    state.trash = state.trash.filter(x=>x.id!==id);
    saveLocal(); render();
    toast('❌ Удалено навсегда');
    return;
  }
  // BEFORE: fetch entire trash collection to verify server state before delete
  try {
    const beforeTrash = await getDocsFromServer(trashCol());
    console.log('[HARDDELETE] Trash collection count BEFORE delete:', beforeTrash.docs.length, 'docs');
    beforeTrash.docs.forEach(d => console.log('[HARDDELETE]   BEFORE trash doc:', d.id));
  } catch(be) {
    console.error('[HARDDELETE] BEFORE collection fetch failed:', be.code || be.message || be);
  }
  // optimistic update
  state.trash = state.trash.filter(x=>x.id!==id);
  render();
  try {
    console.log('[HARDDELETE] Calling deleteDoc...');
    await deleteDoc(doc(state.db,'households',state.householdId,'trash',id));
    console.log('[HARDDELETE] deleteDoc resolved');
    // server-side confirmation to tell offline-pending vs truly committed
    let committed = true;
    try {
      console.log('[HARDDELETE] Verifying with getDocFromServer...');
      const v = await getDocFromServer(doc(state.db,'households',state.householdId,'trash',id));
      committed = !v.exists();
      console.log('[HARDDELETE] Verification result: exists=', v.exists(), 'committed=', committed);
    } catch(ve){
      console.error('[HARDDELETE] Verification failed:', ve.code || ve.message || ve);
      committed = 'unknown';
    }
    // Additional check: fetch entire trash collection to verify server state AFTER delete
    try {
      const allTrash = await getDocsFromServer(trashCol());
      console.log('[HARDDELETE] Trash collection count AFTER delete:', allTrash.docs.length, 'docs');
      allTrash.docs.forEach(d => console.log('[HARDDELETE]   AFTER trash doc:', d.id));
    } catch(ce) {
      console.error('[HARDDELETE] Collection verification failed:', ce.code || ce.message || ce);
    }
    console.error('HARDDELETE_RESULT', id, 'committed=', committed, 'online=', navigator.onLine, 'user=', state.user?.uid);
    if(committed === true){
      toast('✅ Сервер подтвердил удаление');
    } else if(committed === false){
      // doc still exists server-side -> roll back optimistic
      if(item) state.trash.unshift(item);
      render();
      alert('Удаление не прошло на сервере.\nИндикатор связи: ' + (navigator.onLine?'онлайн':'оффлайн') + '\n\nПроверьте правила Firestore (могли истечь) или консоль браузера.');
    } else {
      toast('⚠️ Не удалось проверить сервер: ' + committed);
    }
  } catch(e){
    console.error('[HARDDELETE] Failed:', e.code || e.message || e);
    if(item) state.trash.unshift(item);
    render();
    toast('❌ Ошибка: ' + (e.code||e.message||e));
    alert('Удаление провалилось: ' + (e.code||e.message||e));
  }
}

function deletedMs(r){
  const d = r.deletedAt;
  if(d && typeof d.toMillis === 'function'){
    try { const m = d.toMillis(); if(m) return m; } catch(e){}
  }
  if(typeof d === 'number') return d;
  return r._deletedAtMs || Date.now();
}

function purgeExpiredTrashLocal(){
  const now = Date.now();
  const THIRTY = 30*24*60*60*1000;
  state.trash = state.trash.filter(x => (now - (x.deletedAt||0)) < THIRTY);
}

async function purgeExpiredTrashFirebase(){
  if(state.localMode) return;
  const now = Date.now();
  const THIRTY = 30*24*60*60*1000;
  for(const r of state.trash){
    const ts = deletedMs(r);
    if(ts && (now - ts) >= THIRTY){
      try { await deleteDoc(doc(state.db,'households',state.householdId,'trash',r.id)); } catch(e){}
    }
  }
}
function savePlan(){
  if(state.localMode){ saveLocal(); render(); }
  else { fbSaveWeek(); }
}

// ===== HOUSEHOLD RESOLUTION =====
function resolveHousehold(){
  const params = new URLSearchParams(location.search);
  let h = params.get('h') || params.get('household');
  if(!h){ h = localStorage.getItem('menuapp_household'); }
  if(!h){ h = 'hh_' + Math.random().toString(36).slice(2,10); }
  state.householdId = h;
  localStorage.setItem('menuapp_household', h);
  if(!params.get('h')){
    const u = new URL(location.href);
    u.searchParams.set('h', h);
    history.replaceState({}, '', u.toString());
  }
}

  let html = '';
  if(state.localMode){
    html += `<div class="config-banner">⚠️ <b>Локальный режим.</b> Данные хранятся только в этом браузере. Чтобы делиться с женой, настрой Firebase (вкладка «Поделиться»).</div>`;

  }

      <div style="margin-top:10px">
        ${trashItems.length===0 ? '<p class="muted">Пусто</p>' : ''}
        ${trashItems.map(r => {
          const daysLeft = Math.max(0, 30 - Math.floor((Date.now() - deletedMs(r))/(24*60*60*1000)));
          return `<div class="recipe-card" style="opacity:0.85">
            <h3>${escapeHtml(r.name)}</h3>
            <div class="muted">Удалён. Осталось дней до автоудаления: ${daysLeft}</div>
            <div class="row" style="margin-top:8px">
              <button class="ghost" data-action="restore-recipe" data-id="${r.id}">↩️ Восстановить</button>

            </div>
          </div>`;

  </div>`;

  main.innerHTML = html;
  bindRecipesEvents();
  bindTrashEvents();

      <div class="nut"><b>${n.protein||0}</b>белки</div>
      <div class="nut"><b>${n.fat||0}</b>жиры</div>
      <div class="nut"><b>${n.carbs||0}</b>углеводы</div>
    </div>
    <div class="muted" style="margin-top:4px">Всего ${n.totalGrams||0} г ${perServ? `• 1 порция: ${perServ.kcal} ккал, ${perServ.p}/${perServ.f}/${perServ.c} БЖУ, ${perServ.g} г` : ''}</div>
    <div class="row" style="margin-top:10px">

function bindRecipesEvents(){
  document.getElementById('searchInput')?.addEventListener('input', (e)=>{ state.search = e.target.value; render(); });
  document.getElementById('addRecipeBtn')?.addEventListener('click', ()=>{ state.showRecipeForm = !state.showRecipeForm; state.editingRecipe = null; render(); });
  document.getElementById('addIngBtn')?.addEventListener('click', ()=>{
    const container = document.getElementById('ingContainer');
    const idx = container.children.length;
    const div = document.createElement('div');
    div.className='ing-row'; div.dataset.idx=idx;
    div.innerHTML = `<div><label>Ингредиент</label><input class="ing-name" placeholder="Напр. куриная грудка"></div>
      <div><label>Кол-во</label><input class="ing-amount" type="number" step="0.1"></div>
      <div><label>Ед.</label><select class="ing-unit">${UNITS.map(u=>`<option ${u==='г'?'selected':''}>${u}</option>`).join('')}</select></div>
      <button class="danger" type="button" data-action="remove-ing" data-idx="${idx}">✕</button>`;
    container.appendChild(div);
  });
  document.getElementById('cancelRecipeBtn')?.addEventListener('click', ()=>{ state.showRecipeForm=false; state.editingRecipe=null; render(); });
  document.getElementById('saveRecipeBtn')?.addEventListener('click', saveRecipeHandler);
  document.getElementById('ingContainer')?.addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-action="remove-ing"]');
    if(btn){ btn.closest('.ing-row').remove(); }
  });
  document.querySelectorAll('[data-action="edit-recipe"]').forEach(b=> b.addEventListener('click', ()=>{
    state.editingRecipe = b.dataset.id; state.showRecipeForm = true; render();
    window.scrollTo({top:0,behavior:'smooth'});
  }));
  document.querySelectorAll('[data-action="delete-recipe"]').forEach(b=> b.addEventListener('click', ()=> deleteRecipe(b.dataset.id)));
  document.querySelectorAll('[data-action="add-to-plan"]').forEach(b=> b.addEventListener('click', ()=>{
    state.addRecipeToDay = b.dataset.id;
    state.tab = 'plan'; render();
    toast('Выбери день в плане 👇');
  }));
}

async function saveRecipeHandler(){
  const name = document.getElementById('rf-name').value.trim();
  if(!name){ toast('⚠️ Введите название'); return; }
  const servings = parseInt(document.getElementById('rf-servings').value)||1;
  const process = document.getElementById('rf-process').value.trim();
  const sourceUrl = document.getElementById('rf-source').value.trim();
  const rows = document.querySelectorAll('#ingContainer .ing-row');
  const ingredients = [];
  rows.forEach(row=>{
    const n = row.querySelector('.ing-name').value.trim();
    const a = row.querySelector('.ing-amount').value;
    const u = row.querySelector('.ing-unit').value;
    if(n) ingredients.push({ name: n, amount: a, unit: u });
  });
  if(ingredients.length===0){ toast('⚠️ Добавьте ингредиенты'); return; }

  let screenshot = state.editingRecipe ? (state.recipes.find(x=>x.id===state.editingRecipe)?.screenshot||'') : '';
  let photo = state.editingRecipe ? (state.recipes.find(x=>x.id===state.editingRecipe)?.photo||'') : '';
  const scFile = document.getElementById('rf-screenshot').files[0];
  const phFile = document.getElementById('rf-photo').files[0];
  if(scFile){ try { screenshot = await compressImage(scFile); } catch(e){ toast('Ошибка фото'); } }
  if(phFile){ try { photo = await compressImage(phFile); } catch(e){ toast('Ошибка фото'); } }

  const data = { name, servings, ingredients, process, sourceUrl, screenshot, photo };
  // manual nutrition overrides
  const manual = {};
  const k = document.getElementById('rf-kcal').value;
  const pr = document.getElementById('rf-protein').value;
  const ft = document.getElementById('rf-fat').value;
  const cb = document.getElementById('rf-carbs').value;
  const gr = document.getElementById('rf-grams').value;
  if(k!==''||pr!==''||ft!==''||cb!==''||gr!==''){
    manual.override = true;
    if(k!=='') manual.kcal = parseInt(k);
    if(pr!=='') manual.protein = parseFloat(pr);
    if(ft!=='') manual.fat = parseFloat(ft);
    if(cb!=='') manual.carbs = parseFloat(cb);
    if(gr!=='') manual.totalGrams = parseInt(gr);
  }
  data.manualNutrition = manual.override ? manual : null;
  try {
    if(state.editingRecipe){ await updateRecipe(state.editingRecipe, data); toast('✅ Обновлено'); }
    else { await addRecipe(data); toast('✅ Рецепт добавлен'); }
    state.showRecipeForm = false; state.editingRecipe = null; render();
  } catch(e){ console.error(e); toast('❌ Ошибка сохранения'); }
}

function dayTotalsHtml(dayKey){
  const items = state.plan[dayKey]||[];
  let k=0,p=0,f=0,c=0,g=0;
  for(const it of items){
    const r = state.recipes.find(x=>x.id===it.recipeId);
    if(!r?.nutrition) continue;
    const serv = it.servings||1;
    const n = r.nutrition;
    const perServ = (r.servings||1);
    k += (n.kcal||0)/perServ*serv;
    p += (n.protein||0)/perServ*serv;
    f += (n.fat||0)/perServ*serv;
    c += (n.carbs||0)/perServ*serv;
    g += (n.totalGrams||0)/perServ*serv;
  }
  if(items.length===0) return '';
  return `<div class="nutrition" style="margin-top:8px">
    <div class="nut"><b>${Math.round(k)}</b>ккал</div>
    <div class="nut"><b>${p.toFixed(1)}</b>Б</div>
    <div class="nut"><b>${f.toFixed(1)}</b>Ж</div>
    <div class="nut"><b>${c.toFixed(1)}</b>У</div>
  </div>
  <div class="muted" style="text-align:center;margin-top:2px">${Math.round(g)} г</div>`;
}

function weekTotalsHtml(){
  let k=0,p=0,f=0,c=0;
  for(const d of DAYS){
    const items = state.plan[d.key]||[];
    for(const it of items){
      const r = state.recipes.find(x=>x.id===it.recipeId);
      if(!r?.nutrition) continue;
      const serv = it.servings||1;
      const n = r.nutrition; const perServ = r.servings||1;
      k += (n.kcal||0)/perServ*serv;
      p += (n.protein||0)/perServ*serv;
      f += (n.fat||0)/perServ*serv;
      c += (n.carbs||0)/perServ*serv;
    }
  }
  return `<div class="card"><h3>📊 Итого за неделю</h3>
    <div class="nutrition">
      <div class="nut"><b>${Math.round(k)}</b>ккал</div>
      <div class="nut"><b>${p.toFixed(1)}</b>белки</div>
      <div class="nut"><b>${f.toFixed(1)}</b>жиры</div>
      <div class="nut"><b>${c.toFixed(1)}</b>углеводы</div>
    </div>
    <div class="muted" style="margin-top:6px">В среднем в день: ${Math.round(k/7)} ккал</div>
  </div>`;
}

function bindTrashEvents(){
  document.querySelectorAll('[data-action="restore-recipe"]').forEach(b=> b.addEventListener('click', ()=> restoreRecipe(b.dataset.id)));
  document.querySelectorAll('[data-action="hard-delete-recipe"]').forEach(b=> b.addEventListener('click', ()=> hardDeleteTrash(b.dataset.id)));
  const det = document.getElementById('trashDetails');
  if(det){ det.addEventListener('toggle', ()=>{ state.showTrash = det.open; }); }
}

function bindPlanEvents(){
  document.getElementById('prevWeek')?.addEventListener('click', ()=> changeWeek(-1));
  document.getElementById('nextWeek')?.addEventListener('click', ()=> changeWeek(1));
  document.getElementById('printBtn')?.addEventListener('click', ()=> window.print());
  document.getElementById('copyWeekBtn')?.addEventListener('click', ()=> copyWeekToNext());

  document.querySelectorAll('[data-action="confirm-add-day"]').forEach(b=> b.addEventListener('click', ()=>{
    const day = b.dataset.day;
    const recipeId = state.addRecipeToDay;
    if(!state.plan[day]) state.plan[day]=[];
    state.plan[day].push({ recipeId, servings: 1 });
    state.addRecipeToDay = null;
    savePlan();
    toast('✅ Добавлено');
  }));
  document.querySelector('[data-action="cancel-add"]')?.addEventListener('click', ()=>{ state.addRecipeToDay=null; render(); });

  document.querySelectorAll('select[data-action="quick-add"]').forEach(sel=>{
    sel.addEventListener('change', (e)=>{
      const day = sel.dataset.day;
      const rid = e.target.value;
      if(!rid) return;
      if(!state.plan[day]) state.plan[day]=[];
      state.plan[day].push({ recipeId: rid, servings: 1 });
      e.target.value='';
      savePlan();
      toast('✅ Добавлено');
    });
  });

  document.querySelectorAll('[data-action="remove-planned"]').forEach(b=> b.addEventListener('click', ()=>{
    const day = b.dataset.day; const idx = parseInt(b.dataset.idx);
    state.plan[day].splice(idx,1);
    savePlan();
  }));

  document.querySelectorAll('input[data-action="servings"]').forEach(inp=>{
    inp.addEventListener('change', (e)=>{
      const day = inp.dataset.day; const idx = parseInt(inp.dataset.idx);
      const v = parseInt(inp.value)||1;
      state.plan[day][idx].servings = v;
      savePlan();
    });
  });
}

function changeWeek(delta){
  const d = new Date(state.weekStart);
  d.setDate(d.getDate() + delta*7);
  state.weekStart = getMonday(d);
  state.weekKey = weekKeyOf(state.weekStart);
  if(state.localMode){
    if(!state.weeks[state.weekKey]) state.weeks[state.weekKey] = { plan: defaultPlan(), checked: {} };
    state.plan = state.weeks[state.weekKey].plan;
    state.checked = state.weeks[state.weekKey].checked;
    render();
  } else {
    state.plan = defaultPlan(); state.checked = {};
    state.loading = false;
    subscribeWeek(state.weekKey);
  }
}

async function copyWeekToNext(){
  const nextStart = addDays(state.weekStart, 7);
  const nextKey = weekKeyOf(nextStart);
  const copy = JSON.parse(JSON.stringify(state.plan));
  if(state.localMode){
    state.weeks[nextKey] = { plan: copy, checked: {} };
    saveLocal();
  } else {
    await setDoc(weekDoc(nextKey), { plan: copy, checked: {} }, { merge: true });
  }
  toast('✅ План скопирован на следующую неделю');
  // navigate to next week to view
  state.weekStart = getMonday(nextStart);
  state.weekKey = nextKey;
  if(state.localMode){
    state.plan = state.weeks[nextKey].plan;
    state.checked = state.weeks[nextKey].checked;
    render();
  } else {
    state.plan = defaultPlan(); state.checked = {};
    subscribeWeek(nextKey);
  }
}

// ===== SHOPPING =====
function renderShopping(main){
  const agg = {};
  for(const d of DAYS){
    for(const it of (state.plan[d.key]||[])){
      const r = state.recipes.find(x=>x.id===it.recipeId);
      if(!r) continue;
      for(const ing of (r.ingredients||[])){
        const key = ing.name.toLowerCase().trim() + '|' + ing.unit;
        if(!agg[key]) agg[key] = { name: ing.name, unit: ing.unit, amount: 0 };
        agg[key].amount += parseFloat(ing.amount)||0;
      }
    }
  }
  const items = Object.values(agg);
  const groups = {};
  for(const it of items){
    const cat = categoryOf(it.name);
    if(!groups[cat]) groups[cat] = [];
    groups[cat].push(it);
  }
  for(const cat in groups) groups[cat].sort((a,b)=>a.name.localeCompare(b.name,'ru'));

  let html = `<div class="card"><h2>🛒 Список покупок</h2>
    <p class="muted">Собран из запланированных блюд (неделя ${fmtDate(state.weekStart)}). Отмечай купленное.</p>
    ${items.length===0 ? '<p>План пуст — нечего покупать 🤷</p>' : ''}
  </div>`;
  if(items.length){
    html += `<div class="card">
      <button class="ghost" id="copyShopBtn" style="margin-bottom:10px">📋 Скопировать список</button>`;
    for(const cat of Object.keys(groups).sort()){
      html += `<div class="shop-cat">${cat}</div>`;
      for(const it of groups[cat]){
        const key = it.name.toLowerCase().trim()+'|'+it.unit;
        const checked = !!state.checked[key];
        html += `<div class="shop-item ${checked?'checked':''}">
          <input type="checkbox" data-shop-key="${key}" ${checked?'checked':''}>
          <span>${escapeHtml(it.name)} - ${+it.amount.toFixed(2)} ${escapeHtml(it.unit)}</span>
        </div>`;
      }
    }
    html += `<div style="margin-top:12px"><button class="ghost" id="clearChecks">Сбросить отметки</button></div></div>`;
  }
  main.innerHTML = html;
  bindShoppingEvents();
}

function bindShoppingEvents(){
  document.querySelectorAll('input[data-shop-key]').forEach(cb=>{
    cb.addEventListener('change', (e)=>{
      const key = cb.dataset.shopKey;
      if(cb.checked) state.checked[key]=true; else delete state.checked[key];
      cb.closest('.shop-item').classList.toggle('checked', cb.checked);
      savePlan();
    });
  });
  document.getElementById('clearChecks')?.addEventListener('click', ()=>{
    state.checked = {}; savePlan(); render();
  });
}

// ===== SHARE =====
function renderShare(main){
  const link = location.origin + location.pathname + '?h=' + state.householdId;
  let html = `<div class="card"><h2>🔗 Поделиться</h2>
    <p>Отправь эту ссылку жене — она откроет то же меню и сможет управлять им.</p>
    <div class="link-box" id="shareLink">${escapeHtml(link)}</div>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="copyLink">📋 Копировать ссылку</button>
    </div>
    <p class="muted" style="margin-top:10px">ID семьи: <code>${escapeHtml(state.householdId)}</code></p>
  </div>`;

  if(!state.localMode){
    html += `<div class="card"><h2>🔒 Пароль семьи</h2>
      <p class="muted">Защита данных при шаринге ссылкой. ${state.pwHash ? 'Пароль установлен.' : 'Пароль не установлен (доступ открыт по ссылке).'}</p>
      <div class="row" style="align-items:end">
        <div><label>Новый пароль</label><input id="newPw" type="password" placeholder="Оставь пустым, чтобы снять пароль"></div>
        <button class="primary" id="setPwBtn">Сохранить</button>
      </div>
    </div>`;
  }
  if(state.localMode){
    html += `<div class="card"><h2>⚙️ Настройка Firebase (для шаринга)</h2>
      <ol style="font-size:14px;line-height:1.8">
        <li>Зайди на <a href="https://console.firebase.google.com" target="_blank">console.firebase.google.com</a>, создай проект.</li>
        <li>Включи <b>Authentication → Anonymous</b> (Sign-in method).</li>
        <li>Создай <b>Firestore Database</b> (start in test mode).</li>
        <li>В Project settings скопируй конфиг (apiKey и др.) и вставь в начало файла <code>index.html</code> в переменную <code>FIREBASE_CONFIG</code>.</li>
        <li>Правила Firestore (для семьи):<br>
          <pre style="background:#f5f5f5;padding:8px;border-radius:8px;font-size:12px">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /households/{hh}/{document=**} {
      allow read, write: if request.auth != null;
    }
  }
}</pre>
        </li>
        <li>Разместить на GitHub Pages: создай репо, положи <code>index.html</code>, включи Pages.</li>
      </ol>
    </div>`;
  } else {
    html += `<div class="card"><h3>✅ Firebase подключён</h3><p class="muted">Режим реального времени включён. Изменения синхронизируются автоматически.</p></div>`;
  }
  main.innerHTML = html;
  document.getElementById('copyLink')?.addEventListener('click', ()=>{
    navigator.clipboard.writeText(link).then(()=>toast('✅ Ссылка скопирована')).catch(()=>toast('Скопируй вручную'));
  });
  document.getElementById('setPwBtn')?.addEventListener('click', async ()=>{
    const pw = document.getElementById('newPw').value;
    let hash = null;
    if(pw.trim()!==''){ hash = await hashPassword(pw); }
    try {
      await setDoc(householdRef(), { passwordHash: hash }, { merge: true });
      state.pwHash = hash;
      if(hash){ localStorage.setItem('menuapp_pw_' + state.householdId, hash); state.pwVerified = true; }
      else { localStorage.removeItem('menuapp_pw_' + state.householdId); }
      toast(hash ? '✅ Пароль установлен' : '✅ Пароль снят');
      render();
    } catch(e){ console.error(e); toast('❌ Ошибка'); }
  });
}

async function seedRecipes(){
  if(state.recipes.length > 0) return;
  for(const r of SEED_RECIPES){
    await addRecipe({ name: r.name, servings: r.servings, ingredients: r.ingredients, process: r.process||"", sourceUrl: "", screenshot: "", photo: "" });
  }
}

function updateHeaderStatus(){
  const el = document.getElementById('headerStatus');
  if(!el) return;
  const online = navigator.onLine ? '●' : '○ (оффлайн)';
  if(state.localMode){
    el.textContent = '🟡 LOCAL MODE (no sync) ' + online + ' · Family ID: ' + state.householdId;
    el.style.color = '#ffe';
  } else {
    el.textContent = '🟢 SYNC ACTIVE ' + online + ' · Family ID: ' + state.householdId;
    el.style.color = '#eaffea';
  }
}

window.addEventListener('online', ()=>{ updateHeaderStatus(); if(!state.localMode) try { subscribeRecipes(); subscribeTrash(); subscribeWeek(state.weekKey); } catch(e){} });
window.addEventListener('offline', ()=>{ updateHeaderStatus(); });

document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && !state.localMode){
    try { subscribeRecipes(); subscribeTrash(); subscribeWeek(state.weekKey); } catch(e){}
    updateHeaderStatus();
  }
});

// ===== INIT =====
async function init(){
  resolveHousehold();
  state.weekStart = getMonday(new Date());
  state.weekKey = weekKeyOf(state.weekStart);
  await initFirebase();
  if(state.localMode){
    loadLocal();
    purgeExpiredTrashLocal();
    await seedRecipes();
    state.loading = false;
    render();
  } else {
    try {
      await ensureHouseholdDoc();
      // load password hash
      const hSnap = await getDocFromServer(householdRef());
      state.pwHash = hSnap.exists() ? (hSnap.data().passwordHash || null) : null;
      if(state.pwHash){
        const saved = localStorage.getItem('menuapp_pw_' + state.householdId);
        state.pwVerified = (saved === state.pwHash);
      } else {
        state.pwVerified = true;
      }
      // Force authoritative server read to bypass stale client cache
      console.log('[INIT] Starting forced server fetch for household:', state.householdId);
      try {
        console.log('[INIT] Fetching recipes from server...');
        const rr = await getDocsFromServer(recipesCol());
        console.log('[INIT] Recipes from server:', rr.docs.length, 'docs');
        state.recipes = rr.docs.map(d => ({ id: d.id, ...d.data() }));
        state.recipes.sort((a,b)=> (b.createdAt?.toMillis?.()||0) - (a.createdAt?.toMillis?.()||0));
        
        console.log('[INIT] Fetching trash from server...');
        const tr = await getDocsFromServer(trashCol());
        console.log('[INIT] Trash from server:', tr.docs.length, 'docs');
        state.trash = tr.docs.map(d => ({ id: d.id, ...d.data() }));
        state.trash.sort((a,b)=> (b.deletedAt?.toMillis?.()||b._deletedAtMs||0) - (a.deletedAt?.toMillis?.()||a._deletedAtMs||0));
        
        console.log('[INIT] Fetching week plan from server...');
        const wk = await getDocFromServer(weekDoc(state.weekKey));
        if(wk.exists()){ 
          const d = wk.data(); 
          state.plan = d.plan || DEFAULT_PLAN(); 
          state.checked = d.checked || {}; 
          console.log('[INIT] Week plan loaded from server');
        }
        else { 
          state.plan = DEFAULT_PLAN(); 
          state.checked = {}; 
          console.log('[INIT] No week plan on server, creating default');
          setDoc(weekDoc(state.weekKey), { plan: state.plan, checked: {} }); 
        }
        console.log('[INIT] Server fetch complete, recipes=', state.recipes.length, 'trash=', state.trash.length);
      } catch(e){ 
        console.error('[INIT] Server fetch FAILED:', e.code || e.message || e); 
      }
      subscribeRecipes();
      subscribeTrash();
      subscribeWeek(state.weekKey);
      // seed if empty (one-time)
      setTimeout(async ()=>{ if(state.recipes.length===0) await seedRecipes(); }, 1200);
      state.loading = false;
      setTimeout(()=>{ state.loading=false; render(); }, 800);
    } catch(e){
      console.error('[INIT] Fatal error, falling back to localMode:', e.code || e.message || e);
      state.localMode=true; loadLocal(); state.loading=false; render();
    }
  }
}

document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    state.tab = b.dataset.tab;
    render();
  });
});

init().then(()=>{ updateHeaderStatus(); });
document.querySelector(`nav.tabs button[data-tab="${state.tab}"]`).classList.add('active');
